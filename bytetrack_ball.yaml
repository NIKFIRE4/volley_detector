# bytetrack_ball.yaml
tracker_type: bytetrack

# Мяч маленький и быстрый — нужны низкие пороги детекции
track_high_thresh: 0.2       # снизили — берём менее уверенные детекции мяча
track_low_thresh: 0.05       # очень низкий — не теряем мяч при частичном перекрытии
new_track_thresh: 0.3        # легко создаём новый трек мяча

track_buffer: 90             # держим трек мяча 90 кадров (~3 сек при 30fps) без детекции
match_thresh: 0.7            # достаточно строгий IoU для матчинга мяча
fuse_score: True